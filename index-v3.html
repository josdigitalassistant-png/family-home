<!DOCTYPE html>
<!-- Family Home v3.0.0 — Firebase/Firestore edition. Add ?demo to the URL to try it with sample data (no sign-in, nothing saved). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F0E4">
<title>Family Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-storage-compat.js"></script>
<style>
:root{--ink:#211D1A;--cream:#F6F0E4;--card:#FFFBF3;--sand:#EFE6D2;--muted:#6E655C;--subtle:#8E857A;--yellow:#F7C331;--pink:#F4A6B8;--blue:#6DB3F2;--green:#93C95A;--red:#EF5B37;--lav:#CFC8F5;--teal:#7ED3C4;--sky:#A9D8F7;--peach:#F9C49A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.03em}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-6px) rotate(var(--r,0deg))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.shape{animation:none!important}}

/* shapes */
.shape{position:absolute;animation:bob 4s ease-in-out infinite;transform:rotate(var(--r,0deg));pointer-events:none}
.shape .body{position:absolute;inset:0}
.shape.circle .body{border-radius:50%}
.shape.tri .body{clip-path:polygon(50% 4%,96% 92%,4% 92%)}
.shape.hex .body{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.shape .face{position:absolute;left:0;right:0;top:40%;display:flex;justify-content:center}
.shape.tri .face{top:54%}

/* login */
#login{position:fixed;inset:0;background:var(--yellow);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;z-index:100}
#login .panel{position:relative;background:var(--cream);border-radius:36px 36px 0 0;padding:28px 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#login h1{font-size:40px;line-height:1}
#login p{margin:0 0 8px;color:var(--muted)}
.inp{height:50px;border:0;border-radius:18px;padding:0 16px;font-size:16px;background:var(--card);width:100%;min-width:0}
textarea.inp{height:auto;padding:12px 16px;line-height:1.5;resize:vertical}
.btn-main{height:54px;border-radius:27px;background:var(--red);color:var(--ink);font-size:16px;font-weight:800;box-shadow:0 4px 0 var(--ink);width:100%}
.btn-main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn-main:disabled{opacity:.5}
.btn-ink{height:52px;border-radius:26px;background:var(--ink);color:var(--cream);font-size:15px;font-weight:800;padding:0 20px;text-align:left}
.btn-line{height:48px;border-radius:24px;border:2px solid var(--ink);font-size:15px;font-weight:800;padding:0 18px}
.err{color:#B3261E;font-size:14px;font-weight:600}

/* shell */
#app{display:none;height:100%;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
#app.ready{display:flex}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 6px 18px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.brand small{font-size:11px;color:var(--muted)}
.brand small.bad{color:#B3261E;font-weight:800}
.pill-btn{height:40px;display:flex;align-items:center;gap:6px;padding:0 14px 0 12px;border-radius:20px;background:var(--card);font-weight:800;font-size:13px;box-shadow:0 2px 0 rgba(33,29,26,.12)}
.pill-btn:hover{background:var(--yellow)}
.avatar{width:40px;height:40px;border-radius:50%;font-weight:800;font-size:15px;flex:none}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:496px;bottom:calc(14px + env(safe-area-inset-bottom));height:68px;border-radius:34px;background:var(--ink);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px;z-index:20}
.tabs button{border-radius:28px;color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800}
.tabs button.on{background:var(--yellow);color:var(--ink)}

/* common */
.card{background:var(--card);border-radius:24px}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px 10px}
.h-sec b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.link{font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:4px;display:flex;align-items:center;gap:2px}
.seg{display:flex;padding:3px;border-radius:20px;background:var(--card)}
.seg button{height:36px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:800;flex:1}
.seg button.on{background:var(--ink);color:var(--cream)}
.circ{width:40px;height:40px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.circ:hover{background:var(--yellow)}
.chk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--card)}
.chk.on{background:var(--ink)}
.chip{height:38px;padding:0 14px;border-radius:19px;background:var(--card);font-size:14px;font-weight:800}
.chip.on{background:var(--yellow)}
.chip.ink.on{background:var(--ink);color:var(--cream)}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800}
.empty{padding:24px 18px;display:flex;align-items:center;gap:14px}

/* day */
.hero{margin:8px 12px 0;border-radius:32px;position:relative;overflow:hidden;min-height:212px;padding:22px 20px 20px}
.hero .txt{position:relative;z-index:1;max-width:230px}
.kick{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:5px 10px;border-radius:12px}
.hero h1{font-size:46px;line-height:.95;letter-spacing:-.04em;margin:12px 0 6px}
.daychips{display:flex;gap:8px;overflow-x:auto;padding:14px 12px 4px;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.daychip{flex:none;width:52px;height:64px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.daychip.on{background:var(--ink);color:var(--cream);box-shadow:0 3px 0 var(--yellow)}
.daychip .dn{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.daychip .n{font-size:20px;font-weight:800;line-height:1}
.daychip .dot{width:6px;height:6px;border-radius:50%}
.pack{background:var(--card);border-radius:28px;padding:18px 16px 14px}
.pack-ico{width:40px;height:40px;border-radius:12px;background:var(--pink);display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);flex:none}
.bar{height:10px;border-radius:5px;background:var(--sand);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s cubic-bezier(.3,1.4,.6,1)}
.kitgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kit{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border:2px solid var(--cream);border-radius:18px;background:var(--cream);text-align:left}
.kit .chk{border-color:transparent;background:var(--card)}
.kit.on{background:#EAF4DC;border-color:var(--green)}
.kit.on .chk{background:var(--green);color:#fff}
.kit b{display:block;font-size:15px;font-weight:800;line-height:1.1}
.kit.on b{text-decoration:line-through}
.kit small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.child .kit{min-height:68px}.child .kit b{font-size:18px}
.allpacked{display:flex;align-items:center;gap:10px;background:var(--green);border-radius:18px;padding:10px 12px;margin-bottom:10px;font-weight:800}
.ev{width:100%;display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start;padding:14px 14px 14px 16px;border-radius:24px;text-align:left}
.ev .t{font-size:15px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.ev .t span{font-weight:400;font-size:13px;opacity:.75}
.ev .ti{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.ev .sub{font-size:13px;opacity:.85;margin-top:4px}
.kitchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.kitchips span{font-size:12px;font-weight:800;padding:3px 9px;border-radius:10px;background:rgba(255,251,243,.75);color:var(--ink)}
.gap{border:2px dashed #C9BCA5;border-radius:20px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}

/* week */
.grid{margin:0 8px;background:var(--card);border-radius:28px;padding:10px 6px 12px 0}
.gcols{display:grid;gap:3px}
.ghead{padding:6px 0;border-radius:14px;text-align:center}
.ghead.today{background:var(--ink);color:var(--cream)}
.ghead .dn{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.ghead .n{font-size:17px;font-weight:800;line-height:1.05}
.gcol{position:relative;border-radius:12px}
.gcol.today{background:#FBF1D6}
.blk{position:absolute;border-radius:10px;padding:4px 5px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.blk b{font-size:11px;font-weight:800;line-height:1.1;word-break:break-word}
.blk small{font-size:10px;line-height:1.1;opacity:.75}
.hr{position:absolute;left:0;right:0;border-top:1px dashed #E3D8C4}
.hl{position:absolute;left:0;width:26px;text-align:right;transform:translateY(-50%);font-size:10px;font-weight:600;color:var(--subtle);font-variant-numeric:tabular-nums}
.lrow{width:100%;display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;padding:8px 12px;border-radius:14px;text-align:left}

/* lists */
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;border-radius:18px;background:var(--card);text-align:left;padding:8px 14px}
.row.done{opacity:.55}.row.done .nm{text-decoration:line-through}
.thumb{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
.addbar{display:flex;gap:6px;background:var(--card);border-radius:24px;padding:6px}
.addbar input{flex:1;min-width:0;height:44px;border:0;padding:0 12px;font-size:16px;background:transparent}
.addbar button{height:44px;padding:0 18px;border-radius:20px;background:var(--yellow);font-weight:800;font-size:14px}
.page{padding:12px 12px 0}
.page h2{font-size:32px;margin:4px 6px 12px}
.grp{font-size:13px;font-weight:800;color:var(--muted);margin:0 6px 6px}
.stack{display:flex;flex-direction:column;gap:6px}

/* sheets */
#sheet{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;justify-content:flex-end}
#sheet.open{display:flex}
#sheet .dim{position:absolute;inset:0;background:rgba(33,29,26,.45)}
#sheet .box{position:relative;background:var(--cream);border-radius:32px 32px 0 0;max-height:90%;overflow-y:auto;max-width:520px;width:100%;margin:0 auto;animation:up .25s ease-out;padding-bottom:env(safe-area-inset-bottom)}
.sh-head{display:flex;align-items:center;gap:10px;padding:18px 12px 10px 20px;position:sticky;top:0;background:var(--cream);z-index:2}
.sh-head .k{font-size:12px;font-weight:800;color:var(--muted)}
.sh-head .ti{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sh-body{padding:6px 16px 24px;display:flex;flex-direction:column;gap:14px}
.kv{border-radius:24px;padding:6px 16px}
.kv div{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid rgba(33,29,26,.15)}
.kv div:last-child{border-bottom:0}
.kv b{font-size:13px;font-weight:800}
.drop{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:22px 18px;border:3px dashed var(--ink);border-radius:28px;cursor:pointer;background:var(--lav);position:relative;overflow:hidden}
.drop>*:not(.shape){position:relative}
.spin{width:22px;height:22px;border:3px solid var(--sand);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
.found{width:100%;display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid transparent;border-radius:22px;background:var(--card);text-align:left;opacity:.7}
.found.on{border-color:var(--ink);opacity:1}
.flag{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:10px}
.ttprev{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--card);border-radius:22px;padding:8px}
.ttprev .l{padding:5px 4px;border-radius:8px;margin-bottom:4px}
.ttprev .l b{display:block;font-size:10px;font-weight:800;line-height:1.1;word-break:break-word}
.ttprev .l small{font-size:9px;opacity:.8}
.ttprev .l.chg{outline:2px solid var(--ink);outline-offset:1px}
#toast{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;bottom:calc(94px + env(safe-area-inset-bottom));background:var(--yellow);padding:12px 14px;border-radius:22px;display:none;align-items:center;gap:10px;font-size:14px;font-weight:800;z-index:60;box-shadow:0 4px 0 var(--ink)}
#toast.show{display:flex}
#toast button{border-radius:14px;background:var(--ink);color:var(--cream);font-weight:800;font-size:13px;padding:6px 12px}
</style>
</head>
<body>

<div id="login">
  <div id="login-shapes"></div>
  <div class="panel">
    <h1>Family Home</h1>
    <p>Days, weeks, shopping and pocket money.</p>
    <div id="login-form" style="display:flex;flex-direction:column;gap:10px">
      <input id="login-email" class="inp" type="email" placeholder="Email" autocomplete="username">
      <input id="login-password" class="inp" type="password" placeholder="Password" autocomplete="current-password">
      <div id="login-error" class="err" style="display:none"></div>
      <button id="signin-btn" class="btn-main" style="margin-top:4px">Sign in</button>
      <button id="forgot-btn" class="link" style="align-self:flex-start;margin-top:4px">Forgot password?</button>
    </div>
    <div id="login-wait" style="display:none;align-items:center;gap:12px;height:54px;font-weight:800"><span class="spin"></span>Signing in…</div>
    <div style="font-size:11px;color:var(--subtle);margin-top:4px" id="login-version"></div>
  </div>
</div>

<div id="app">
  <div class="top" id="top"></div>
  <div id="main"></div>
  <div class="tabs" id="tabs"></div>
</div>
<div id="toast"></div>
<div id="sheet"><div class="dim" data-a="close"></div><div class="box" id="sheet-box"></div></div>

<script>
const APP_VERSION = '3.0.0';
const STORAGE_KEY = 'familyapp_v1';
const CLAUDE_MODEL = 'claude-sonnet-4-5';
const CHILD_EMAIL = 'kaskesophia@gmail.com';
const DEMO = /[?&]demo\b/.test(location.search);

// ─── Firebase ───
const firebaseConfig = {
  apiKey: "AIzaSyC9L9xT61H5DzkD5vzTSdOPj6aUg1DF8Z4",
  authDomain: "fiaapp-8413f.firebaseapp.com",
  projectId: "fiaapp-8413f",
  storageBucket: "fiaapp-8413f.firebasestorage.app",
  messagingSenderId: "811845007884",
  appId: "1:811845007884:web:10f2512cc15fec329dcc29"
};
let auth = null, db = null, storage = null;
if (!DEMO) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); db = firebase.firestore(); storage = firebase.storage();
  db.enablePersistence({synchronizeTabs:true}).catch(e => console.warn('Offline persistence not enabled:', e.code));
}
function householdDoc(name) { return db.collection('householdData').doc(name); }

// ─── Local settings (same key as v2) ───
function ls() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) { return {}; } }
function lsSet(patch) { const s = Object.assign(ls(), patch); localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); return s; }
function getAnthropicKey() { return ls().anthropicKey || ''; }

// ─── Data (shapes match the v2 Firestore documents) ───
let currentUser = null;
let activities = [];
let shopping = [];
let nextId = 1;
let payments = [];
let contactsData = { sophia: [], emergency: [] };
let timetable = {};
let scheduleFile = { url: null, name: null, uploadedAt: null };
let sync = { state: 'idle', at: null };

const UI = { tab: 'day', planOff: 1, week: 0, view: 'grid', weekend: false, preview: false, sheet: null };

// ─── Helpers ───
const DN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ML = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYKEY = {1:'mon',2:'tue',3:'wed',4:'thu',5:'fri',6:'sat',0:'sun'};
const KITS = ['Sports kit','Swim kit','Art apron','Instrument','Water bottle','Packed lunch'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
function localDate(str) { if (!str) return null; const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }
function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function dowOf(str) { const js = localDate(str).getDay(); return js === 0 ? 7 : js; }
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mm = t => { if (!t) return null; const [a,b] = t.split(':'); return +a * 60 + +b; };
const hm = n => pad(Math.floor(n / 60)) + ':' + pad(n % 60);
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const cleanKit = k => String(k || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
const fmtDay = d => DL[d.getDay()] + ' ' + d.getDate() + ' ' + MN[d.getMonth()];
const money = n => (Math.round(n * 100) / 100).toFixed(2);
function weekStart(off) { const d = today(); d.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1) + off * 7); return d; }
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }

const isRealChild = () => !!(currentUser && currentUser.email && currentUser.email.toLowerCase() === CHILD_EMAIL);
const isChild = () => isRealChild() || UI.preview;
const canEdit = () => !isChild();

// ─── Icons (Lucide) ───
const P = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',

// ─── Week ───
const PX = 0.8;

  const hasAllDay = days.some(x => x.items.allDay.length);
  const range = ws.getDate() + (ws.getMonth() !== we.getMonth() ? ' ' + MN[ws.getMonth()] : '') + ' – ' + we.getDate() + ' ' + MN[we.getMonth()];

    <div style="padding:0 12px 12px;display:flex;gap:8px;align-items:center">

  if (UI.view === 'grid') {

      ${days.map(x => `<div class="ghead ${x.ds === tds ? 'today' : ''}"><div class="dn">${DN[x.d.getDay()]}</div><div class="n">${x.d.getDate()}</div></div>`).join('')}</div></div>`;
    if (hasAllDay) h += `<div style="display:flex;margin-bottom:4px"><div style="width:32px;flex:none"></div><div class="gcols" style="flex:1;${cols}">
      ${days.map(x => `<div style="display:flex;flex-direction:column;gap:2px">${x.items.allDay.map(it => `<button class="blk" data-a="detail" data-ds="${x.ds}" data-uid="${esc(it.uid)}" style="position:static;background:${colorOf(it)};color:${fgOf(it)};padding:3px 5px"><b>${esc(it.title)}</b></button>`).join('')}</div>`).join('')}</div></div>`;
    h += `<div style="display:flex;position:relative;height:${gridH}px"><div style="width:32px;flex:none;position:relative">`;
    for (let x = Math.ceil(GS / 60); x * 60 <= GE; x++) h += `<div class="hl" style="top:${(x * 60 - GS) * PX}px">${pad(x)}</div>`;
    h += '</div><div style="flex:1;position:relative">';
    for (let x = Math.ceil(GS / 60); x * 60 <= GE; x++) h += `<div class="hr" style="top:${(x * 60 - GS) * PX}px"></div>`;
    h += `<div class="gcols" style="position:absolute;inset:0;${cols}">`;
    days.forEach(x => {

      h += `<div class="card" style="padding:12px"><div style="display:flex;align-items:baseline;gap:8px;padding:2px 4px 8px"><span style="font-size:17px;font-weight:800">${fmtDay(x.d)}</span><span style="font-size:12px;color:var(--muted)">${all.length ? all.length + (all.length === 1 ? ' thing' : ' things') : 'Nothing planned'}</span></div><div class="stack" style="gap:4px">

    });
    h += '</div>';
  }

}

      r.onload = e => res({ block: { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: e.target.result.split(',')[1] } }, thumb: null });
      r.readAsDataURL(file);

        const MAX = 1800, sc = Math.min(1, MAX / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', .88);
        res({ block: { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: url.split(',')[1] } }, thumb: url });
      }; img.onerror = () => rej(new Error('That file is not an image or PDF')); img.src = e.target.result; };
      r.readAsDataURL(file);
    }
  });
}

  const data = await res.json().catch(() => ({}));

}
const EVENTS_PROMPT = t => `This is a screenshot or document from a Swiss primary school app (may be German). Today is ${dateStr(t)} (${DL[t.getDay()]}). Extract every dated event, change or reminder that affects the child's schedule (excursions, sports day, photos, cancelled lessons, early finish, things to bring). Resolve relative dates like "nächsten Donnerstag" against today; assume the nearest future date if the year is missing.
Return ONLY a JSON array, no prose: [{"title":"short English title","date":"YYYY-MM-DD","start":"HH:MM or empty","end":"HH:MM or empty","location":"","kit":["things to bring, in English, e.g. Sports kit, Packed lunch, Water bottle"],"notes":"one short sentence or empty"}]. If nothing is found return [].`;
const TT_PROMPT = `This is a school timetable (Stundenplan), possibly in German. Read every lesson Monday to Friday with its start and end time (use the period times shown on the side if lessons only show a period number; merge consecutive periods of the same subject into one lesson).
Return ONLY JSON, no prose: {"mon":[{"subject":"Deutsch","start":"08:00","end":"09:35"}],"tue":[],"wed":[],"thu":[],"fri":[]}. Keep subject names as written (e.g. Deutsch, Mathe, NMG, Turnen, Schwimmen, Werken).`;
const normT = s => String(s || '').toLowerCase().replace(/[^a-z0-9äöü]/g, '');
function checkFound(list) {
  return list.filter(e => e && e.title && /^\d{4}-\d{2}-\d{2}$/.test(e.date)).map(e => {
    const x = { title: String(e.title).trim(), date: e.date, start: /^\d{1,2}:\d{2}$/.test(e.start || '') ? pad(e.start.split(':')[0]) + ':' + e.start.split(':')[1] : '', end: /^\d{1,2}:\d{2}$/.test(e.end || '') ? pad(e.end.split(':')[0]) + ':' + e.end.split(':')[1] : '', location: e.location || '', kit: (e.kit || []).map(cleanKit).filter(Boolean), notes: e.notes || '' };
    x.allDay = !x.start; if (x.start && !x.end) x.end = hm(Math.min(mm(x.start) + 60, 23 * 60 + 59));
    const its = itemsFor(localDate(x.date)), all = [...its.allDay, ...its.timed];
    x.dup = all.some(it => it.kind !== 'lesson' && (normT(it.title) === normT(x.title) || (normT(it.title).includes(normT(x.title)) && normT(x.title).length > 4)));
    if (!x.dup && x.start) { const o = its.timed.filter(it => mm(it.start) < mm(x.end) && mm(it.end) > mm(x.start)); if (o.length) x.clash = 'Overlaps ' + [...new Set(o.map(i => i.title))].slice(0, 3).join(', '); }
    return x;
  });
}
function normTT(r) {
  const out = {};
  ['mon','tue','wed','thu','fri'].forEach(k => out[k] = (Array.isArray(r[k]) ? r[k] : []).filter(l => l && l.subject && /^\d{1,2}:\d{2}$/.test(l.start || '') && /^\d{1,2}:\d{2}$/.test(l.end || ''))
    .map(l => ({ subject: String(l.subject).trim(), start: pad(l.start.split(':')[0]) + ':' + l.start.split(':')[1], end: pad(l.end.split(':')[0]) + ':' + l.end.split(':')[1], kit: autoKitFor(l.subject) }))
    .sort((a, b) => mm(a.start) - mm(b.start)));
  if (!Object.values(out).some(a => a.length)) throw new Error('No lessons with times found. Try a clearer photo.');
  return out;
}
async function runImport(file) {
  const s = UI.sheet; if (!s || s.type !== 'import') return;
  const mode = s.mode;
  Object.assign(s, { step: 'reading', fileName: file.name, thumb: null, progress: 0 }); renderSheet();
  const tick = setInterval(() => { if (UI.sheet === s && s.step === 'reading' && s.progress < 2) { s.progress++; renderSheet(); } }, 2500);
  try {
    const { block, thumb } = await fileToBlock(file); s.thumb = thumb; renderSheet();
    let r;
    if (DEMO) { await new Promise(ok => setTimeout(ok, 2400)); r = mode === 'events' ? demoFound() : demoTT(); }
    else r = await askClaude(block, mode === 'events' ? EVENTS_PROMPT(today()) : TT_PROMPT);
    if (mode === 'events') { s.results = checkFound(Array.isArray(r) ? r : (r.events || [])); s.sel = s.results.map(e => !e.dup); }
    else s.results = normTT(r);
    s.step = 'review';
  } catch (e) { console.error('Import:', e); s.step = 'error'; s.error = e.message || String(e); }
  clearInterval(tick); if (UI.sheet === s) renderSheet();
}
function addFound() {
  const s = UI.sheet, add = s.results.filter((_, i) => s.sel[i]); if (!add.length) return;
  add.forEach((e, i) => activities.push({ id: 'act_' + Date.now() + '_' + i, title: e.title, type: 'school', icon: '', scheduleType: 'oneoff', date: e.date, allDay: e.allDay, startTime: e.start, endTime: e.end, location: e.location, notes: e.notes, kit: e.kit, drop: '', pick: '', source: 'import' }));
  const first = localDate(add.map(e => e.date).sort()[0]);
  UI.sheet = null; saveAppData(); render();
  toast(add.length + (add.length === 1 ? ' event' : ' events') + ' added', 'View', () => { UI.tab = 'week'; UI.view = 'grid'; UI.week = weekOffsetOf(first); if (first.getDay() % 6 === 0) UI.weekend = true; render(); });
}
function applyTT() {
  const r = UI.sheet.results;
  Object.keys(r).forEach(k => { timetable[k] = r[k].length ? ttEntry(r[k]) : { subjects: [], kit: [] }; });
  UI.sheet = null; saveAppData(); render();
  toast('Timetable updated', 'View', () => { UI.tab = 'week'; UI.view = 'grid'; UI.week = 0; render(); });
}

function resizePhoto(file, cb) {

    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .8)); }; img.src = ev.target.result; }; r.readAsDataURL(file);
